name: Nightly agent specs

# The agent specs (e2e/specs) don't run on pull requests: they're long, and
# written for agents working against a dev server. Nightly they run against
# the production preview, so they can't rot unnoticed.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: 'Write new screenshot baselines and upload them, instead of comparing'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  agent-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Screenshots compare pixel for pixel, so the browser and the system under
    # it are pinned: Playwright's own image, with the browsers of the version
    # the lockfile has. Bump the tag with @playwright/test (a mismatch fails
    # loudly: the browser isn't there), then remake the baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version is read from the "packageManager" field in package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Builds the app and serves the preview
      - name: Run the agent specs against the preview
        run: pnpm run e2e:specs ${{ inputs.update-snapshots && '--update-snapshots=all' || '' }}

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: agent-specs-report
          path: e2e-report/
          retention-days: 14

      # Commit these into e2e/specs/ to adopt them
      - name: Upload new screenshot baselines
        uses: actions/upload-artifact@v7
        if: ${{ inputs.update-snapshots }}
        with:
          name: screenshot-baselines
          path: e2e/specs/**/*-specs-linux.png
          retention-days: 14
